name: Deploy app

# On every merge to main: publish an OTA update to the preview channel when
# only JS changed, or start a new preview APK build when native code changed
# (decided by comparing the runtime fingerprint with existing EAS builds).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: OTA update or new build
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Update or build
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          working-directory: mobile
          profile: preview
          branch: preview
          environment: preview
          platform: android
